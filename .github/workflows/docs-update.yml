name: Docs update check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'next.config.ts'
      - 'package.json'
      - '.env.example'
      - 'docs/**'
      - 'scripts/docs-update/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org

      - name: Triage docs + build artifacts
        id: docs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          CI: true
        run: |
          export OPENAI_MODEL="${OPENAI_MODEL:-gpt-4o-mini}"
          ARGS=(--base "origin/${{ github.base_ref }}")

          if [ -n "$OPENAI_API_KEY" ]; then
            # Agent select + generate suggestions (CI implies --apply when key present)
            ARGS+=(--apply)
            echo "mode=agent-apply" >> "$GITHUB_OUTPUT"
            echo "Triage agent enabled (OPENAI_API_KEY present)"
          else
            echo "mode=heuristic" >> "$GITHUB_OUTPUT"
            echo "::warning::OPENAI_API_KEY secret not set — using heuristic triage only."
          fi

          npm run docs:update -- "${ARGS[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-update-output
          path: docs-update-output/
          if-no-files-found: warn

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = 'docs-update-output/comment.md'
            if (!fs.existsSync(path)) {
              core.warning('comment.md missing; skipping PR comment')
              return
            }
            const body = fs.readFileSync(path, 'utf8')
            const marker = '<!-- docs-update-bot -->'
            const { owner, repo } = context.repo
            const issue_number = context.issue.number

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.find((c) => c.body && c.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
              core.info(`Updated comment ${existing.id}`)
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
              core.info('Created docs-update comment')
            }
